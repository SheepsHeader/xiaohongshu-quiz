<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FDFCFA">
<title>你最像历史里的哪个人物</title>
<meta name="description" content="20 道题，照见你的前世人设 别想太多，凭第一直觉选。">
<meta property="og:title" content="你最像历史里的哪个人物">
<meta property="og:description" content="20 道题，照见你的前世人设 别想太多，凭第一直觉选。">
<style>
:root{
  --paper:#FDFCFA;
  --desk:#F0EDE7;
  --ink:#1A1714;
  --ink-2:#5C554D;
  --ink-3:#9A9288;
  --line:rgba(26,23,20,.11);
  --line-soft:rgba(26,23,20,.06);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,.68,.24,1);
  --accent:#A63A50;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--desk);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

#stage{
  position:relative;
  width:100%;
  max-width:480px;
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  background:var(--paper);
  box-shadow:0 0 60px -30px rgba(26,23,20,.35);
}

/* ---------- 屏幕 ---------- */
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(10px);
  pointer-events:none;
  transition:opacity .4s var(--ease),transform .4s var(--ease);
  padding:calc(env(safe-area-inset-top) + 30px) 32px calc(env(safe-area-inset-bottom) + 28px);
  overflow:hidden;
}
.screen.is-active{opacity:1;transform:none;pointer-events:auto}
.screen.is-leaving{opacity:0;transform:translateY(-8px)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ruleIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.7) rotate(-11deg)}
  58%{opacity:1;transform:scale(.93) rotate(1.5deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

/* ---------- 按钮 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:17px 20px;
  font-family:var(--serif);font-size:17px;letter-spacing:.22em;
  transition:transform .18s var(--ease),opacity .2s;
}
.btn:active{transform:scale(.985)}
.btn--primary{
  background:var(--ink);color:var(--paper);
}
.btn--ghost{
  border:1px solid var(--line);color:var(--ink-2);
  font-size:14px;letter-spacing:.18em;padding:14px;
}
.btn__arrow{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink-2);
}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 封面 ---------- */
.screen--cover{justify-content:space-between}
.cover__kicker{
  font-size:11px;letter-spacing:.42em;color:var(--accent);
  text-transform:uppercase;
  animation:rise .7s var(--ease) both;
}
.cover__body{margin:auto 0;padding:6vh 0}
.cover__title{
  font-family:var(--serif);
  font-size:clamp(42px,13.5vw,60px);
  line-height:1.18;font-weight:700;letter-spacing:.01em;
}
.cover__title span{display:block;animation:rise .8s var(--ease) both}
.cover__title span:nth-child(1){animation-delay:.05s}
.cover__title span:nth-child(2){animation-delay:.14s}
.cover__title span:nth-child(3){animation-delay:.23s;color:var(--accent)}
.cover__rule{
  height:1px;background:var(--line);margin:26px 0 22px;
  transform-origin:left;animation:ruleIn .9s var(--ease) .34s both;
}
.cover__sub{
  font-size:14px;line-height:2;color:var(--ink-2);letter-spacing:.05em;
  white-space:pre-line;
  animation:rise .8s var(--ease) .38s both;
}
.cover__meta{
  display:flex;align-items:center;gap:18px;margin-bottom:24px;
  animation:fadeIn .9s var(--ease) .5s both;
}
.cover__stat{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3)}
.cover__stat-line{width:1px;height:12px;background:var(--line)}
.screen--cover .btn{animation:rise .8s var(--ease) .55s both}
.cover__foot{
  margin-top:14px;text-align:center;font-size:10.5px;letter-spacing:.08em;
  color:var(--ink-3);animation:fadeIn 1s var(--ease) .7s both;
}

/* ---------- 答题 ---------- */
.screen--quiz{padding-top:calc(env(safe-area-inset-top) + 18px)}
.progress{position:absolute;top:0;left:0;right:0;height:1.5px;background:var(--line-soft)}
.progress i{
  display:block;height:100%;width:0;background:var(--accent);
  transition:width .4s var(--ease);
}
.quiz__head{display:flex;align-items:center;gap:14px;padding:14px 0 0}
.quiz__counter{display:flex;align-items:baseline;gap:4px;font-family:var(--serif);font-size:12px;color:var(--ink-3)}
.quiz__counter b{font-size:16px;color:var(--ink);font-weight:700}
.quiz__hint{margin-left:auto;font-size:10.5px;letter-spacing:.2em;color:var(--ink-3)}
.quiz__body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px;padding-bottom:5vh;overflow-y:auto}
.quiz__q{
  font-family:var(--serif);
  font-size:clamp(24px,6.6vw,29px);line-height:1.62;font-weight:700;letter-spacing:.015em;
  animation:rise .45s var(--ease) both;
}
.quiz__opts{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line-soft)}
.opt{
  display:flex;align-items:center;gap:15px;
  padding:19px 4px;text-align:left;
  border-bottom:1px solid var(--line-soft);
  font-size:15.5px;line-height:1.55;color:var(--ink-2);
  transition:color .2s,background .25s,padding .25s var(--ease);
  animation:rise .45s var(--ease) both;
}
.opt:nth-child(1){animation-delay:.03s}
.opt:nth-child(2){animation-delay:.08s}
.opt:nth-child(3){animation-delay:.13s}
.opt:nth-child(4){animation-delay:.18s}
.opt:active{background:rgba(166,58,80,.05)}
.opt__key{
  flex:none;font-family:var(--serif);font-size:12px;color:var(--ink-3);
  width:14px;transition:color .2s;
}
.opt.is-picked{color:var(--ink);background:rgba(166,58,80,.07);padding-left:12px;padding-right:12px}
.opt.is-picked .opt__key{color:var(--accent)}
.opt.is-dim{opacity:.35}

/* ---------- 计算中 ---------- */
.screen--loading{align-items:center;justify-content:center}
.loading__inner{text-align:center;width:100%}
.loading__rule{
  height:1px;background:var(--accent);width:0;margin:0 auto 34px;
  animation:ruleIn 1.6s var(--ease) forwards;
}
.loading__text{
  font-family:var(--serif);font-size:18px;letter-spacing:.2em;color:var(--ink);
}
.loading__line{
  margin-top:16px;font-size:11.5px;letter-spacing:.16em;color:var(--ink-3);
  min-height:18px;animation:fadeIn .45s var(--ease) both;
}

/* ---------- 结果 ---------- */
.screen--result{padding:0;overflow:hidden}
.result__scroll{
  height:100%;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 34px) 32px calc(env(safe-area-inset-bottom) + 34px);
  scrollbar-width:none;
}
.result__scroll::-webkit-scrollbar{display:none}

.card__no{
  font-size:10.5px;letter-spacing:.32em;color:var(--ink-3);
  animation:fadeIn .6s var(--ease) .1s both;
}
.card__seal{
  display:inline-block;margin:26px 0 30px;
  padding:7px 15px;border:1px solid var(--accent);
  font-size:10px;letter-spacing:.2em;color:var(--accent);
  transform-origin:left center;
  animation:stamp .6s var(--ease) .3s both;
}
.card__seal b{font-weight:700;font-size:11px}
.card__name{
  font-family:var(--serif);
  font-size:clamp(56px,18vw,80px);line-height:1.02;font-weight:700;letter-spacing:.02em;
  animation:rise .7s var(--ease) .22s both;
}
.card__title{
  margin-top:16px;font-family:var(--serif);font-size:19px;letter-spacing:.16em;color:var(--ink-2);
  animation:rise .6s var(--ease) .3s both;
}
.card__era{
  display:flex;align-items:center;gap:11px;margin-top:11px;
  font-size:11px;letter-spacing:.2em;color:var(--ink-3);
  animation:rise .6s var(--ease) .34s both;
}
.card__era i{width:1px;height:10px;background:var(--line)}
.same-count{
  font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--ink-2);
  animation:rise .6s var(--ease) .68s both;
}
.same-count b{color:var(--accent);font-size:23px;font-weight:700}
.card__quote{
  margin-top:34px;padding-left:18px;border-left:2px solid var(--accent);
  font-family:var(--serif);font-size:17.5px;line-height:1.95;letter-spacing:.04em;color:var(--ink);
  animation:rise .6s var(--ease) .4s both;
}
.card__traits{
  list-style:none;margin-top:34px;display:flex;flex-direction:column;gap:18px;
  animation:rise .6s var(--ease) .46s both;
}
.card__traits li{
  position:relative;padding-left:20px;
  font-size:14px;line-height:1.95;color:var(--ink-2);letter-spacing:.02em;
}
.card__traits li::before{
  content:"";position:absolute;left:0;top:.85em;width:9px;height:1px;background:var(--accent);
}
.result__tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;animation:rise .6s var(--ease) .5s both}
.result__tags span{
  padding:5px 11px;border:1px solid var(--line);
  font-size:11px;letter-spacing:.1em;color:var(--ink-2);
}

.divider{height:1px;background:var(--line);margin:44px 0 38px;animation:ruleIn .8s var(--ease) .5s both;transform-origin:left}

.block__label{
  font-size:10.5px;letter-spacing:.3em;color:var(--ink-3);margin-bottom:18px;
}
.story{
  font-family:var(--serif);font-size:15.5px;line-height:2.1;letter-spacing:.02em;
  color:var(--ink);text-align:justify;
  animation:rise .6s var(--ease) .54s both;
}
.story::first-letter{
  font-size:2.6em;line-height:1;float:left;
  margin:.06em .12em 0 0;color:var(--accent);font-weight:700;
}

.result__desc{display:flex;flex-direction:column;gap:20px;animation:rise .6s var(--ease) .58s both}
.result__desc p{
  font-size:14px;line-height:2.05;color:var(--ink-2);text-align:justify;letter-spacing:.01em;
}

.result__dims{display:flex;flex-direction:column;gap:16px;animation:rise .6s var(--ease) .62s both}
.dim{display:grid;grid-template-columns:50px 1fr 30px;align-items:center;gap:14px}
.dim__label{font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--ink-2)}
.dim__track{height:2px;background:var(--line-soft);position:relative;overflow:hidden}
.dim__fill{
  position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);
  transition:width 1s var(--ease);
}
.dim__val{font-family:var(--serif);font-size:11.5px;color:var(--ink-3);text-align:right}

.second{
  display:flex;align-items:baseline;gap:12px;
  animation:rise .6s var(--ease) .66s both;
}
.second__name{font-family:var(--serif);font-size:22px;font-weight:700}
.second__title{font-size:12px;letter-spacing:.14em;color:var(--ink-3)}

.result__actions{display:flex;flex-direction:column;gap:10px;margin-top:46px;animation:rise .6s var(--ease) .7s both}

/* ---------- 海报 ---------- */
.screen--poster{justify-content:center;padding-left:24px;padding-right:24px}
.poster__wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.poster__canvas{
  max-width:100%;max-height:66dvh;width:auto;height:auto;
  box-shadow:0 20px 50px -24px rgba(26,23,20,.5);
  animation:rise .5s var(--ease) both;
}
.poster__tip{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);text-align:center}

@media (min-height:860px){
  .quiz__body{gap:46px}
  .cover__body{padding:9vh 0}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

</style>
</head>
<body>
<div id="stage">

  <!-- ============ 封面 ============ -->
  <section class="screen screen--cover is-active" data-screen="cover">
    <header class="cover__kicker" data-bind="kicker"></header>

    <div class="cover__body">
      <h1 class="cover__title" data-cover-title></h1>
      <div class="cover__rule"></div>
      <p class="cover__sub" data-bind="subtitle"></p>
    </div>

    <div class="cover__meta">
      <span class="cover__stat" data-bind="hook"></span>
      <span class="cover__stat-line"></span>
      <span class="cover__stat" data-bind="avgTime"></span>
    </div>

    <button class="btn btn--primary" data-act="start">
      <span data-bind="startBtn"></span>
      <svg viewBox="0 0 24 24" class="btn__arrow" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>

    <p class="cover__foot">结果仅供自我观察，不作任何专业诊断</p>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="screen screen--quiz" data-screen="quiz">
    <div class="progress"><i data-progress-bar></i></div>

    <div class="quiz__head">
      <button class="icon-btn" data-act="back" aria-label="上一题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="quiz__counter"><b data-idx>01</b><span>/</span><span data-total></span></div>
      <div class="quiz__hint">凭第一直觉</div>
    </div>

    <div class="quiz__body">
      <h2 class="quiz__q" data-question></h2>
      <div class="quiz__opts" data-options></div>
    </div>
  </section>

  <!-- ============ 计算中 ============ -->
  <section class="screen screen--loading" data-screen="loading">
    <div class="loading__inner">
      <div class="loading__rule"></div>
      <p class="loading__text" data-loading-text></p>
      <p class="loading__line" data-loading-line></p>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="screen screen--result" data-screen="result">
    <div class="result__scroll">

      <div class="card__no" data-dossier></div>

      <div class="card__seal" data-seal></div>

      <h1 class="card__name" data-bind="name"></h1>
      <p class="card__title" data-bind="title"></p>
      <p class="card__era"><span data-bind="era"></span><i></i><span data-bind="role"></span></p>

      <blockquote class="card__quote" data-bind="quote"></blockquote>

      <ul class="card__traits" data-traits></ul>

      <div class="result__tags" data-tags></div>

      <div class="divider"></div>
      <p class="block__label" data-bind="layout.blocks.story"></p>
      <p class="story" data-bind="story"></p>

      <div class="divider"></div>
      <p class="block__label" data-bind="layout.blocks.desc"></p>
      <div class="result__desc" data-desc></div>

      <div class="divider"></div>
      <p class="block__label" data-bind="layout.blocks.dims"></p>
      <div class="result__dims" data-dims></div>

      <div class="divider"></div>
      <p class="block__label" data-bind="layout.blocks.second"></p>
      <div class="second" data-second></div>

      <div class="divider"></div>
      <p class="block__label" data-bind="layout.blocks.same"></p>
      <p class="same-count" data-same></p>

      <div class="result__actions">
        <button class="btn btn--primary" data-act="poster">生成分享长图</button>
        <button class="btn btn--ghost" data-act="restart">再测一次</button>
      </div>

      <p class="cover__foot">结果仅供自我观察，不作任何专业诊断</p>
    </div>
  </section>

  <!-- ============ 海报 ============ -->
  <section class="screen screen--poster" data-screen="poster">
    <div class="poster__wrap">
      <canvas class="poster__canvas" data-poster></canvas>
      <p class="poster__tip">长按图片保存，发到评论区让朋友也来测</p>
      <div class="result__actions">
        <button class="btn btn--ghost" data-act="back-result">返回结果</button>
      </div>
    </div>
  </section>

<script>window.__QUIZ__ = {"meta":{"slug":"historical-figures","title":"你最像历史里的哪个人物","titleLines":["你最像","历史里的","哪个人物"],"kicker":"人格考古 · 第一卷","subtitle":"20 道题，照见你的前世人设\n别想太多，凭第一直觉选。","avgTime":"约 3 分钟","startBtn":"开始照见","rarityLabel":"稀有度","rarityText":"全国仅 {pct}% 的人属于这一类","loadingSteps":["正在翻检史书的边角…","比对人物原型…","你的前世人设正在显影…"],"theme":{"accent":"#A63A50"},"layout":{"blocks":{"story":"那个时刻","desc":"三个切面","dims":"你的坐标","second":"还有一面","same":"和你同一类"},"poster":{"kicker":"人 格 考 古","lead":"你的前世人设是","title":"你最像历史里的哪个人物？","foot":"20 道题 · 3 分钟 · 照见你的前世人设"}}},"dims":[{"key":"guts","label":"胆魄"},{"key":"mind","label":"谋略"},{"key":"heart","label":"深情"},{"key":"will","label":"执念"}],"types":[{"id":"sushi","name":"苏轼","title":"一蓑烟雨","era":"北宋","role":"文豪","quote":"一蓑烟雨任平生。","tags":["旷达","通透","乐天"],"dims":{"guts":66,"mind":88,"heart":70,"will":30},"rarityFactor":1.07,"theme":{"accent":"#8A6D3B"},"story":"沙湖道上的雨说来就来。同行的人抱着头往树底下钻，草鞋陷进泥里，一路骂声。你手里只有一根竹杖、一双芒鞋，索性不躲了，放开步子慢慢走。雨灌进领口，你反倒笑出声——原来淋成这样，也没什么要紧。","misread":"别人以为你心大、什么都不往心里去，其实你把难过都消化成了笑意。","desc":["你不是没脾气，是脾气上来时还能顺手讲个笑话。方案被改到第七遍，你会先把杯里的茶喝完，再回一句「行，我改」。别人以为你什么都咽得下去，其实你只是算过一遍：这口气，值不值得用三天去换。","你在关系里最会给台阶。对方话说到一半卡住，你会替他把后半句接上，再轻轻带过去。你很少追问，也不大会讨要——朋友散了你说各忙各的，其实那天你翻了三次手机，等一条消息。","你适合总要处理突发的那类活。别人崩的时候，你还能把事情拆成三件小事，一件件做完。你唯一的风险是太会自己消化，把「算了」说成了习惯——有些事，你该开口去要。"]},{"id":"libai","name":"李白","title":"人间谪仙","era":"盛唐","role":"诗人","quote":"天生我材必有用，千金散尽还复来。","tags":["自由","浪漫","不羁"],"dims":{"guts":78,"mind":55,"heart":92,"will":30},"rarityFactor":1.09,"theme":{"accent":"#4A5F9E"},"story":"南陵的早上，马已经备在门外。你把孩子托给邻居，回头看了一眼住了大半年的屋子，忽然仰头大笑。那些说你没正形的话，你一句没改。你翻身上马，只说这回去长安，得让他们好好看看。","misread":"别人以为你吊儿郎当、不靠谱，其实你只是没法对不喜欢的事假装认真。","desc":["你的情绪是满的，来得快，去得也快。地铁上听到一段旋律，你能当场红了眼眶；第二天早上又觉得那点事不值一提。你不是不稳，你是把一天过成了别人的三天，累也累在这。","你对人极真，也极容易走神。答应过的事你会记得，只是常忘了具体是哪天。留住你的从来不是热闹，是那种不催你、也不假装懂你的人。别人一问「你以后打算」，你心里那扇门就悄悄关上了。","你最值钱的东西是那股不管不顾的表达欲，千万别把它塞进流程里。你适合做能署名的事：写、拍、演、卖你自己做出来的东西。你唯一的风险是开太多头——起头漂亮，收尾要靠运气。"]},{"id":"xinqiji","name":"辛弃疾","title":"醉里挑灯","era":"南宋","role":"词人","quote":"了却君王天下事，赢得生前身后名，可怜白发生。","tags":["热血","刚烈","不甘"],"dims":{"guts":92,"mind":72,"heart":80,"will":95},"rarityFactor":1.04,"theme":{"accent":"#8E3B2F"},"story":"那年你二十二岁，只带了五十个人，趁夜直冲进金营。叛徒正和人举杯，你把刀搁在他脖颈上时，那只酒盏还端在手里。你没等他喊出声，反手捆上马背，一路冲出营门，天还没亮。","misread":"别人以为你浑身是刺、太好强，其实你只是有股劲儿一直没找到出口。","desc":["你身上有一股一直没散的火。别人觉得事情已经算完了，你还在想那个本该更好的版本。你不太会表演情绪，气到顶的时候反而一句话不说，只是把手里的东西攥得很紧。","你对人好得直接：说一声，我到了。可你不擅长把委屈讲出口，别人就以为你不需要安慰。你最容易走进的死角是——替对方扛了太多，又暗自记账，最后自己觉得不值。","你是那种能把死局啃出缝的人，越是没人愿意接的摊子越对味。你唯一的风险是把事看得比命重，赢了也不肯放过自己。请给自己留一点没意义的下午，那不算浪费。"]},{"id":"liqingzhao","name":"李清照","title":"生当人杰","era":"两宋","role":"词人","quote":"生当作人杰，死亦为鬼雄。","tags":["敏感","刚烈","洁癖"],"dims":{"guts":72,"mind":78,"heart":96,"will":62},"rarityFactor":0.94,"theme":{"accent":"#7A4A63"},"story":"南渡这些年，箱子一年比一年少。这一夜你又把它们一只只打开，指腹擦过纸页上的旧痕。窗外雨落在瓦上，你翻到某一页，行间有他补的字。你就那样坐着，很久没有翻下一页。","misread":"别人以为你敏感脆弱，其实你比谁都硬气，只是把柔软留给了值得的人。","desc":["你对细节的记性有点过分。一句随口的话、一个停顿的长度，你都能收进去，隔很久还能原封不动拿出来。这让你的感受很厚，也让一些早该翻页的事，在你这里一直留着温度。","你要的从来不是热闹，是有人听得懂你那半句没说出口的。你可以为一个人做到很细，细到记得对方不吃什么。你唯一的风险是太会自己忍——不说，是怕一开口就变成了打扰。","你适合把感受变成东西的活：写、做设计、剪片子，把一件小事讲到有滋味。你有一种别人替不了的准头，一上手就知道哪里不对。别接你心里瞧不上的活，那种消耗你要很久才缓得过来。"]},{"id":"wangyangming","name":"王阳明","title":"此心光明","era":"明","role":"宗师","quote":"此心光明，亦复何言。","tags":["内求","定力","通透"],"dims":{"guts":60,"mind":96,"heart":70,"will":92},"rarityFactor":0.87,"theme":{"accent":"#5C5240"},"story":"被贬到那个连屋顶都漏的地方，随从一个个病倒。你自己劈柴、担水、煮粥，把他们都喂好了。夜里没有书，你就对着石洞坐着，把一个问题翻来覆去地问：道理到底在外面，还是在心里。某夜你忽然站起来，笑出了声。","misread":"别人以为你清高、不合群，其实你只是懒得跟解释不通的事耗下去。","desc":["你不太会被场面带走。一屋子人在急，你还在慢慢问：这件事到底要解决什么。你不爱抢话，但一开口常把讨论拉回原点。久了别人发现，你不是没态度，是早想过三遍才说。","你交朋友很挑，但不难相处。你听得懂客套背后的意思，所以格外珍惜那些说话不用绕的人。你唯一的风险是把人想得太明白——有时候对方只想被陪着骂两句，不需要你的解法。","你是靠长期积累赢的那一类，不靠爆发。认定一条路，你能在里面待很久；别人换赛道时，你还在原来那一格上加码。你缺的不是判断，是偶尔明知不完美也先干一版的胆子。"]},{"id":"huoqubing","name":"霍去病","title":"少年封侯","era":"西汉","role":"将军","quote":"匈奴未灭，何以家为。","tags":["锐气","果决","无畏"],"dims":{"guts":98,"mind":52,"heart":32,"will":90},"rarityFactor":0.83,"theme":{"accent":"#2F5D6B"},"story":"有人领你去新宅，梁木还是新的，院子大到能跑马。你绕了一圈，没说什么，出来只留了一句：仗还没打完，要家做什么。说完你上了马，甲还没卸，身后的尘土一路扬到城门。","misread":"别人以为你冷漠、不近人情，其实你只是目标在前，暂时没空回头。","desc":["你做事不看气氛，只看还差几步。开会时你最常说的是「那就先做」，说完已经动上手了。别人还在讨论风险，你一轮都试完了。你不是不怕，你是觉得原地干想更难受。","你不太会说软话，习惯用做完某件事来代替。答应得太快、解释得太少，容易让人误会你不在乎。其实你在乎的方式很笨：对方随口提过要买的东西，你会默默买好放到他桌上。","你跑得比别人快，是因为你不背太多东西。给你一个目标就能起跑，也不怕得罪人。你唯一的风险是把人当成路上的补给点——等你回头，值得一起吃顿饭的人已经不多了。"]},{"id":"zhouyu","name":"周瑜","title":"曲误周郎","era":"东汉末","role":"都督","quote":"曲有误，周郎顾。","tags":["雅量","才情","风度"],"dims":{"guts":74,"mind":96,"heart":68,"will":66},"rarityFactor":1,"theme":{"accent":"#4A6B5A"},"story":"宴上乐声一起，满座举盏，你端着酒没动。第三段有个音偏了半分，别人没听出来。你放下酒盏，回头看了一眼弹琴的人。那一眼很轻，那人当场红了脸。你笑了笑，把杯子重新端起来。","misread":"别人以为你心高气傲、输不起，其实你只是对自己有要求，从没想跟谁较劲。","desc":["你对自己有要求，而且是那种不说出口的要求。衣服的褶、方案的行距、说完一句话后对方脸上的那半秒，你都留意。你很少当场指出来，只回去一个人改，改到自己满意。","你希望关系是体面的：不吵、不拖、不翻旧账。你能把话说到刚好，也因此常让人揣摩。你最容易吃亏的地方是——被误会时懒得辩，总觉得懂你的人不需要解释。","你既能想清楚也能落地，给你一个摊子，你不会只交一份 PPT。你最该防的不是对手，是自己那口气：太在意体面，会让你在本该出头的时候退了半步。"]},{"id":"xiangyu","name":"项羽","title":"不肯渡江","era":"秦末","role":"霸王","quote":"力拔山兮气盖世。","tags":["骄傲","烈性","不回头"],"dims":{"guts":96,"mind":32,"heart":74,"will":88},"rarityFactor":0.88,"theme":{"accent":"#8E1F2F"},"story":"帐里灯很暗。四面唱起了楚地的歌，一句一句传进来，你按着剑没动。她坐在对面，替你斟了最后一杯。你唱了自己编的那首，声音越唱越低。有人别过脸去抹眼睛。天亮之前，你带八百人冲了出去。","misread":"别人以为你骄傲、不肯低头，其实你认输了，只是接受不了那种狼狈的输法。","desc":["你做决定很快，快到别人还在犹豫，你已经在路上了。你不太算细账，觉得算来算去是怯。你认的是那一口气——事情可以不成，但不能做得难看。","你的喜欢很重，重到对方有时接不住。你能为一个人做到不讲道理的地步，也会因为对方退了一步就觉得天塌了。你要的其实很简单：我掏出来的时候，你别躲。","你敢开局，而且赢起来漂亮，适合从零到一的那一段。你唯一的风险是不擅长收尾——该低头、该止损、该认一句我错了的时候，你常常选择把整张桌子掀掉。"]},{"id":"wuzetian","name":"武则天","title":"无字之碑","era":"唐","role":"女皇","quote":"他们都说不可能，我已经做完了。","tags":["目标感","破局","不信命"],"dims":{"guts":88,"mind":90,"heart":34,"will":100},"rarityFactor":0.78,"theme":{"accent":"#7B1F4B"},"story":"即位那天，殿里站满了人，跪的和没跪的都在看你。你一级一级走上最高的台阶，靴底压过旧地毯，谁都没有扶你。坐下之前你回头扫了一眼：那些年说过不可能的人，此刻全在下面。然后你坐下了。","misread":"别人以为你心狠、什么都算计，其实你只是想看看那套规矩到底能拦你到哪一步。","desc":["你听到「这是规矩」时，第一反应不是遵守，而是谁定的。你不太在乎过程好不好看，只问结果到没到。别人的评价对你不构成阻力，反而常被你当成路标——朝反方向看一眼。","你不粘人，也不太会说软话，喜欢用解决问题的方式表达在乎。被你看中的人，会拿到你全部的资源。你唯一的风险是把关系也当成一件要办成的事——有些人只想被听见，不想被安排。","你天生是来破局的那类人。别人还在权衡要不要动，你已经在想怎么动、动完谁负责。你能扛住别人扛不住的压力，代价是很少有人问过你怕不怕。给自己留一个什么都不做的下午。"]},{"id":"mulan","name":"花木兰","title":"代父从军","era":"北朝","role":"战士","quote":"该扛的，我一个人扛。","tags":["担当","坚韧","利落"],"dims":{"guts":84,"mind":60,"heart":62,"will":70},"rarityFactor":0.98,"theme":{"accent":"#4C5C63"},"story":"市集那天你跑遍东市西市，把马、鞍鞯、辔头、长鞭一件件配齐。回到家，你把头发束起，换了衣裳，站在父亲面前说：我去。他没说话，把缰绳递到你手里。天没亮你就出了门，一次也没回头。","misread":"别人以为你天生坚强、不需要人疼，其实你只是习惯了有人需要就自己顶上。","desc":["你不太说，比较做。事情落到你手上，你先想怎么把它办完，很少问这事该不该我来。别人夸你稳，其实你只是知道：抱怨一轮之后，活还是那些活。","你在关系里总是顶上去的那个。对方最难的时候你在，而且不太提自己也有难的时候。你唯一的风险是太能被依靠——久了所有人都记得你很行，忘了你也会想找人靠一下。","你是团队里最不该被省掉的那一块。交给你的事不用再问第二遍，缺的那一环你会自己补上。你适合要交付、有结果的位置。请学会提要求，你的付出该被算进去。"]}],"questions":[{"q":"方案被当众否掉，还顺带被扣了顶「没想清楚」的帽子，你第一反应是？","opts":[{"t":"当场把方案摊开，一句句问回到底哪没想清","w":{"xiangyu":2},"d":{"guts":3,"will":2,"heart":1}},{"t":"先笑一下，回去把每一处漏洞补成附件","w":{"zhouyu":2},"d":{"mind":3,"will":2,"guts":1}},{"t":"不解释，两个月后拿数据和结果摆回同一张桌","w":{"wuzetian":2},"d":{"will":3,"mind":3,"guts":2}},{"t":"先接一句自嘲，转头把方案里对的部分圈出来","w":{"sushi":2},"d":{"mind":2,"heart":2,"will":1}}]},{"q":"凌晨一点手机终于安静，白天咽下去的情绪全翻上来，你会？","opts":[{"t":"干脆起来跑两公里，把那股劲耗掉再睡","w":{"huoqubing":2},"d":{"guts":3,"will":3}},{"t":"打开备忘录，写下一段自己都吓一跳的话","w":{"libai":2},"d":{"heart":3,"guts":2,"will":1}},{"t":"坐起来，把想不通的那件事从头问自己一遍","w":{"wangyangming":2},"d":{"mind":3,"will":2}},{"t":"不睡，把那段对话一句句重放，越放越清楚","w":{"liqingzhao":2},"d":{"heart":3,"mind":2,"will":1}}]},{"q":"眼前有个能让你跃一大步的机会，但要押上攒了很久的钱和安稳，你？","opts":[{"t":"算清最坏的结果，能接受就押上去","w":{"wuzetian":2},"d":{"will":3,"mind":3,"guts":2}},{"t":"先跳进去，钱和安稳以后再说","w":{"huoqubing":2},"d":{"guts":3,"will":3,"mind":1}},{"t":"先问三年后还想不想要，答案决定押不押","w":{"sushi":2},"d":{"mind":3,"heart":2,"will":1}},{"t":"心里那股劲一上头，先答应了再回来发愁","w":{"libai":2},"d":{"heart":3,"guts":2,"will":0}}]},{"q":"对方说「我们先各自冷静一下」，你心里最真实的声音是？","opts":[{"t":"好，那就各自待着，风过了自然会回来","w":{"sushi":2},"d":{"mind":2,"heart":2,"will":1}},{"t":"行。正好我手上还有更急的事","w":{"huoqubing":2},"d":{"will":3,"guts":2}},{"t":"一句话 ":{"wuzetian":2},"d":{"will":3,"mind":3,"guts":2}},{"t":"把气氛接住，谁被冷落我一眼看得出","w":{"zhouyu":2},"d":{"mind":3,"heart":1,"guts":2}},{"t":"跟谁都聊两句，跟谁都不深聊","w":{"sushi":2},"d":{"heart":2,"guts":2,"mind":2}}]},{"q":"有件事能让你很快成，但手段有点踩线，你的天平往哪边倒？","opts":[{"t":"先问最坏能坏到哪，兜得住就走","w":{"wuzetian":2},"d":{"will":3,"mind":3,"guts":2}},{"t":"这种脏东西拿在手里，我会硌得慌","w":{"liqingzhao":2},"d":{"heart":3,"mind":2,"will":1}},{"t":"踩线的不做，绕远路我也要办成","w":{"xinqiji":2},"d":{"will":3,"guts":2,"heart":2}},{"t":"先弄清自己认不认，认了才谈成不成","w":{"wangyangming":2},"d":{"mind":3,"will":2,"guts":0}}]},{"q":"家里把一整个期待压到你肩上，你会？","opts":[{"t":"接下来，但按我的方式来，谁也别插手","w":{"wuzetian":2},"d":{"will":3,"guts":3,"mind":2}},{"t":"不说累，把这件事默默做成","w":{"mulan":2},"d":{"guts":3,"will":3,"heart":1}},{"t":"接了，也把话说明白：只此一次","w":{"sushi":2},"d":{"mind":3,"heart":2,"will":1}},{"t":"嘴上应下，心里已经开始发凉","w":{"liqingzhao":2},"d":{"heart":3,"mind":2,"will":1}}]},{"q":"总有人不打招呼就闯进你的时间和空间，你会？","opts":[{"t":"用玩笑把话挡回去，回头自己把门锁上","w":{"sushi":2},"d":{"mind":3,"heart":2,"will":1}},{"t":"先陪他把话说完，再提一句我这边有事","w":{"zhouyu":2},"d":{"mind":3,"guts":2,"heart":1}},{"t":"心里立刻想走，之后能躲就躲","w":{"libai":2},"d":{"heart":3,"guts":2,"will":0}},{"t":"当场拦住，说清楚这块归我说了算","w":{"mulan":2},"d":{"guts":3,"will":2,"heart":1}}]},{"q":"眼前有个很诱人、但你心里清楚不该碰的东西，你会？","opts":[{"t":"不碰就是不碰，东西我都不多看一眼","w":{"huoqubing":2},"d":{"guts":3,"will":3}},{"t":"先站住问自己：是想要，还是不甘心","w":{"wangyangming":2},"d":{"mind":3,"will":2,"guts":0}},{"t":"忍着不碰，但这口气我得记下来","w":{"xinqiji":2},"d":{"will":3,"guts":2,"heart":2}},{"t":"不碰，转身去拿更该拿的那个","w":{"wuzetian":2},"d":{"will":3,"mind":3,"guts":2}}]},{"q":"一个话题大家都装看不见，你喉咙里堵着话，你会？","opts":[{"t":"那就开这个口，后果我自己担","w":{"xiangyu":2},"d":{"guts":3,"will":2,"mind":0}},{"t":"把话说完，一句不落，没人应也说完","w":{"xinqiji":2},"d":{"guts":3,"will":3,"heart":2}},{"t":"先掂量一句话能换什么，再开口","w":{"wuzetian":2},"d":{"will":3,"mind":3,"guts":2}},{"t":"先不吭声，把该准备的都准备好","w":{"mulan":2},"d":{"guts":2,"will":3,"heart":1}}]},{"q":"难得有一整块自己的时间，你最可能怎么花掉？","opts":[{"t":"一个人晃出去，走到哪算哪","w":{"libai":2},"d":{"heart":3,"gut     tags: document.querySelector('[data-tags]'),

    desc: document.querySelector('[data-desc]'),
    second: document.querySelector('[data-second]'),
    same: document.querySelector('[data-same]'),
    loadingText: document.querySelector('[data-loading-text]'),
    loadingLine: document.querySelector('[data-loading-line]'),
    poster: document.querySelector('[data-poster]')
  };

  var KEY_LABELS = ['A', 'B', 'C', 'D', 'E', 'F'];

  function $(sel, root) { return (root || document).querySelector(sel); }
  function pad(n) { return String(n).length < 2 ? '0' + n : String(n); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function comma(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // 主题通用：文案一律从 meta 走路径取，模板里不写死任何主题相关字样
  function getPath(obj, path) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function bindText(el, value) {
    el.textContent = value == null ? '' : value;
  }

  function replay(root) {
    var nodes = root.querySelectorAll('*');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (!n.style || getComputedStyle(n).animationName === 'none') continue;
      n.style.animation = 'none';
      void n.offsetWidth;
      n.style.animation = '';
    }
  }

  function go(name) {
    var cur = $('.screen.is-active');
    var next = $('[data-screen="' + name + '"]');
    if (cur === next) return;
    if (cur) {
      cur.classList.add('is-leaving');
      cur.classList.remove('is-active');
      setTimeout(function () { cur.classList.remove('is-leaving'); }, 420);
    }
    next.classList.add('is-active');
    replay(next);
  }

  function applyTheme(theme) {
    if (theme && theme.accent) stage.style.setProperty('--accent', theme.accent);
  }

  /* ---------- 伪递增的已测人数 ---------- */
  // 纯静态无后端，用「基数 + 天数 × 日增速」保证任何人任何时刻看到的数字单调递增
  var base = 0;
  var rate = 0;
  var total = 0;

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h;
  }

  function initCount() {
    var seed = hashStr(Q.meta.slug || Q.meta.title);
    base = 9000 + (seed % 21000);
    rate = 80 + (seed % 220);
    var from = Date.parse(Q.deployedAt || Q.meta.deployedAt || '');
    if (isNaN(from)) from = Date.now();
    var days = Math.max(0, Math.floor((Date.now() - from) / 86400000));
    total = base + Math.floor(days * rate);
  }

  /* ---------- 数据自检 ---------- */
  function validate() {
    var errs = [];
    var ids = Q.types.map(function (t) { return t.id; });
    Q.questions.forEach(function (q, qi) {
      if (q.opts.length !== 4) errs.push('第 ' + (qi + 1) + ' 题选项数不是 4');
      q.opts.forEach(function (o) {
        Object.keys(o.w || {}).forEach(function (k) {
          if (ids.indexOf(k) === -1) errs.push('第 ' + (qi + 1) + ' 题引用了未知类型 ' + k);
        });
      });
    });
    if (errs.length) console.warn('[quiz] 数据问题:\n' + errs.join('\n'));
  }

  /* ---------- 封面 ---------- */
  function renderCover() {
    var meta = Q.meta;
    var lines = meta.titleLines && meta.titleLines.length ? meta.titleLines : [meta.title];
    el.coverTitle.innerHTML = lines.map(function (l) {
      return '<span>' + escapeHtml(l) + '</span>';
    }).join('');

    var binds = document.querySelectorAll('.screen--cover [data-bind]');
    for (var i = 0; i < binds.length; i++) {
      var key = binds[i].getAttribute('data-bind');
      if (key === 'hook') {
        binds[i].textContent = '已有 ' + comma(total) + ' 人完成';
      } else {
        bindText(binds[i], getPath(meta, key));
      }
    }
    document.title = meta.title;
    el.total.textContent = Q.questions.length;
    if (meta.theme) applyTheme(meta.theme);
  }

  /* ---------- 答题 ---------- */
  function renderQuestion() {
    var q = Q.questions[state.i];
    el.question.textContent = q.q;
    el.idx.textContent = pad(state.i + 1);
    el.bar.style.width = (state.i / Q.questions.length * 100) + '%';

    el.options.innerHTML = '';
    q.opts.forEach(function (o, oi) {
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="opt__key">' + KEY_LABELS[oi] + '</span><span>' + escapeHtml(o.t) + '</span>';
      btn.addEventListener('click', function () { pick(oi, btn); });
      el.options.appendChild(btn);
    });
  }

  function pick(oi, btn) {
    var box = btn.parentNode;
    if (box.dataset.locked === '1') return;
    box.dataset.locked = '1';

    var all = el.options.querySelectorAll('.opt');
    for (var i = 0; i < all.length; i++) all[i].classList.add('is-dim');
    btn.classList.remove('is-dim');
    btn.classList.add('is-picked');

    state.picks[state.i] = oi;
    setTimeout(function () {
      box.dataset.locked = '0';
      if (state.i + 1 < Q.questions.length) {
        state.i++;
        renderQuestion();
      } else {
        el.bar.style.width = '100%';
        startLoading();
      }
    }, 300);
  }

  function stepBack() {
    if (state.i === 0) return;
    state.i--;
    renderQuestion();
  }

  /* ---------- 计算 ---------- */
  function compute() {
    var typeScore = {};
    var dimScore = {};
    var dimCeil = {};

    Q.dims.forEach(function (d) { dimScore[d.key] = 0; dimCeil[d.key] = 0; });

    Q.questions.forEach(function (q, qi) {
      var maxD = {};
      q.opts.forEach(function (o) {
        Object.keys(o.d || {}).forEach(function (k) {
          maxD[k] = Math.max(maxD[k] || 0, o.d[k]);
        });
      });
      Object.keys(maxD).forEach(function (k) { dimCeil[k] = (dimCeil[k] || 0) + maxD[k]; });

      var choice = q.opts[state.picks[qi]] || q.opts[0];
      Object.keys(choice.w || {}).forEach(function (k) {
        typeScore[k] = (typeScore[k] || 0) + choice.w[k];
      });
      Object.keys(choice.d || {}).forEach(function (k) {
        dimScore[k] = (dimScore[k] || 0) + choice.d[k];
      });
    });

    var ranked = Q.types.map(function (t) {
      // rarityFactor < 1 让该类型更难胜出，用于制造稀缺感
      var raw = typeScore[t.id] || 0;
      return { type: t, score: raw * (t.rarityFactor == null ? 1 : t.rarityFactor) };
    }).sort(function (a, b) { return b.score - a.score; });

    // 并列时随机，否则数组顺序会造成系统性偏置
    var top = ranked.filter(function (r) { return r.score === ranked[0].score; });
    var winner = top[Math.floor(Math.random() * top.length)].type;
    var second = ranked.filter(function (r) { return r.type.id !== winner.id; })[0];

    var dims = Q.dims.map(function (d) {
      var ceil = dimCeil[d.key] || 1;
      var pct = Math.round((0.15 + (dimScore[d.key] / ceil) * 0.85) * 100);
      return { key: d.key, label: d.label, raw: dimScore[d.key], pct: Math.min(99, pct) };
    });

    return { type: winner, second: second ? second.type : null, dims: dims };
  }

  function buildTraits(result) {
    var sorted = result.dims.slice().sort(function (a, b) { return b.raw - a.raw; });
    var maxDim = sorted[0].key;
    var minDim = sorted[sorted.length - 1].key;
    var out = [];
    if (Q.traits && Q.traits.high && Q.traits.high[maxDim]) out.push(Q.traits.high[maxDim]);
    if (Q.traits && Q.traits.low && Q.traits.low[minDim]) out.push(Q.traits.low[minDim]);
    if (result.type.misread) out.push(result.type.misread);
    return out;
  }

  function dossierNo() {
    var h = 0;
    for (var i = 0; i < state.picks.length; i++) h = (h * 33 + state.picks[i] + i) >>> 0;
    return 'No.' + (1000 + (h % 9000));
  }

  /* ---------- 加载 ---------- */
  function startLoading() {
    go('loading');
    var steps = Q.meta.loadingSteps || ['正在计算…', '比对结果…', '马上出结果…'];
    var i = 0;
    el.loadingText.textContent = steps[0];
    el.loadingLine.textContent = '';
    var timer = setInterval(function () {
      i++;
      if (i >= steps.length) {
        clearInterval(timer);
        setTimeout(showResult, 560);
        return;
      }
      el.loadingLine.textContent = steps[i];
    }, 780);
  }

  /* ---------- 结果 ---------- */
  function showResult() {
    current = compute();
    var t = current.type;
    if (t.theme) applyTheme(t.theme);

    var binds = document.querySelectorAll('.screen--result [data-bind]');
    for (var i = 0; i < binds.length; i++) {
      var key = binds[i].getAttribute('data-bind');
      if (key.indexOf('layout.') === 0) bindText(binds[i], getPath(Q.meta, key));
      else bindText(binds[i], t[key]);
    }

    // 副信息行（年代/身份等）是主题相关的，没有就整行不显示
    var eraRow = document.querySelector('.card__era');
    if (eraRow) eraRow.style.display = (!t.era && !t.role) ? 'none' : '';

    el.dossier.textContent = dossierNo();

    var pct = Q.stats && Q.stats[t.id];
    el.seal.innerHTML = '<b>' + (pct != null
      ? (Q.meta.rarityText || '全国仅 {pct}%').replace('{pct}', pct)
      : '稀缺') + '</b>';

    var traits = buildTraits(current);
    el.traits.innerHTML = traits.map(function (x) {
      return '<li>' + escapeHtml(x) + '</li>';
    }).join('');

    el.tags.innerHTML = t.tags.map(function (x) { return '<span>' + escapeHtml(x) + '</span>'; }).join('');

    el.desc.innerHTML = t.desc.map(function (p) { return '<p>' + escapeHtml(p) + '</p>'; }).join('');

    el.dims.innerHTML = current.dims.map(function (d) {
      return '<div class="dim"><span class="dim__label">' + escapeHtml(d.label) + '</span>' +
        '<span class="dim__track"><i class="dim__fill" data-w="' + d.pct + '"></i></span>' +
        '<span class="dim__val">' + d.pct + '</span></div>';
    }).join('');

    if (current.second) {
      el.second.innerHTML = '<span class="second__name">' + escapeHtml(current.second.name) + '</span>' +
        '<span class="second__title">' + escapeHtml(current.second.title) + '</span>';
    }

    // 同类型人数必须与稀有度自洽，否则眼尖的用户会发现「稀有的反而更多人」
    var sameN = pct != null ? Math.round(total * pct / 100) : 0;
    el.same.innerHTML = '和你测出同一个人的，全国大约有 <b>' + comma(sameN) + '</b> 人。';

    go('result');
    setTimeout(function () {
      var fills = el.dims.querySelectorAll('.dim__fill');
      for (var i = 0; i < fills.length; i++) fills[i].style.width = fills[i].dataset.w + '%';
    }, 240);
  }

  /* ---------- 海报 ---------- */
  function hexA(hex, a) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function wrapText(ctx, text, cx, y, maxW, lh) {
    var line = '';
    for (var i = 0; i < text.length; i++) {
      var test = line + text[i];
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, cx, y);
        line = text[i];
        y += lh;
      } else {
        line = test;
      }
    }
    if (line) { ctx.fillText(line, cx, y); return y + lh; }
    return y;
  }

  var PAPER = '#FDFCFA';
  var INK = '#1A1714';
  var INK2 = '#5C554D';
  var INK3 = '#9A9288';

  function buildPoster() {
    if (!current) return;
    var t = current.type;
    var accent = (t.theme && t.theme.accent) || '#A63A50';
    var W = 750, H = 1240, cx = W / 2;
    var c = el.poster;
    c.width = W; c.height = H;
    var x = c.getContext('2d');

    x.fillStyle = PAPER;
    x.fillRect(0, 0, W, H);

    x.strokeStyle = 'rgba(26,23,20,.1)';
    x.lineWidth = 1;
    x.strokeRect(30, 30, W - 60, H - 60);

    x.textAlign = 'center';

    var L = (Q.meta.layout && Q.meta.layout.poster) || {};

    x.fillStyle = accent;
    x.font = '500 22px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText(L.kicker || Q.meta.kicker || '', cx, 112);

    x.fillStyle = INK3;
    x.font = '400 21px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText(L.lead || '', cx, 196);

    x.fillStyle = INK;
    var nameSize = t.name.length > 3 ? 100 : 126;
    x.font = '700 ' + nameSize + 'px "Songti SC","SimSun",serif';
    x.fillText(t.name, cx, 322);

    x.fillStyle = INK2;
    x.font = '400 34px "Songti SC","SimSun",serif';
    x.fillText(t.title, cx, 390);

    x.fillStyle = INK3;
    x.font = '400 20px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText(t.era + '　' + t.role, cx, 436);

    var pct = Q.stats && Q.stats[t.id];
    if (pct != null) {
      var sealTxt = '全国仅 ' + pct + '% 的人属于这一类';
      x.font = '400 21px "PingFang SC","Microsoft YaHei",sans-serif';
      var sw = x.measureText(sealTxt).width + 52;
      x.strokeStyle = accent;
      x.lineWidth = 1.4;
      x.strokeRect(cx - sw / 2, 474, sw, 54);
      x.fillStyle = accent;
      x.fillText(sealTxt, cx, 509);
    }

    x.fillStyle = INK;
    x.font = '400 30px "Songti SC","SimSun",serif';
    wrapText(x, '「' + t.quote + '」', cx, 620, W - 200, 52);

    var traitY = 716;
    var traits = buildTraits(current).slice(0, 3);
    traits.forEach(function (txt, i) {
      var y = traitY + i * 78;
      x.strokeStyle = accent;
      x.lineWidth = 1.4;
      x.beginPath();
      x.moveTo(110, y - 8);
      x.lineTo(132, y - 8);
      x.stroke();

      x.textAlign = 'left';
      x.fillStyle = INK2;
      x.font = '400 22px "PingFang SC","Microsoft YaHei",sans-serif';
      var end = wrapText(x, txt, 146, y, W - 260, 38);
      x.textAlign = 'center';
      traitY = Math.max(traitY, end - 78);
    });

    var barY = 1018;
    var barW = W - 300;
    var barX = 220;
    current.dims.forEach(function (d, i) {
      var y = barY + i * 44;
      x.textAlign = 'left';
      x.fillStyle = INK3;
      x.font = '400 20px "Songti SC","SimSun",serif';
      x.fillText(d.label, 110, y + 7);

      x.fillStyle = 'rgba(26,23,20,.08)';
      x.fillRect(barX, y, barW, 4);
      x.fillStyle = accent;
      x.fillRect(barX, y, barW * (d.pct / 100), 4);

      x.textAlign = 'right';
      x.fillStyle = INK3;
      x.font = '400 19px "Songti SC","SimSun",serif';
      x.fillText(d.pct, W - 110, y + 7);
      x.textAlign = 'center';
    });

    x.strokeStyle = 'rgba(26,23,20,.12)';
    x.beginPath(); x.moveTo(110, 1150); x.lineTo(W - 110, 1150); x.stroke();

    x.fillStyle = INK2;
    x.font = '400 22px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText(L.title || (Q.meta.title + '？'), cx, 1192);
    x.fillStyle = INK3;
    x.font = '400 18px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText(L.foot || '', cx, 1224);

    go('poster');
  }

  /* ---------- 启动 ---------- */
  function reset() {
    state = { i: 0, picks: [] };
    applyTheme(Q.meta.theme);
    renderCover();
    renderQuestion();
    go('cover');
  }

  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'start') { state.i = 0; state.picks = []; renderQuestion(); go('quiz'); }
    else if (act === 'back') stepBack();
    else if (act === 'restart') { reset(); }
    else if (act === 'poster') buildPoster();
    else if (act === 'back-result') go('result');
  });

  initCount();
  validate();
  reset();
})();

</script>
</body>
</html>
